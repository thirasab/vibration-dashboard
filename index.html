<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบมอนิเตอร์อัจฉริยะ (Vib, Sound & Bag Filter)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase (Vibration & Sound) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <!-- MQTT (Bag Filter) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <!-- Charts & Time -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>

  <style>
    /* RESET & THEME CONFIGURATION */
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg-color: #f6f8fa;
      --card-bg: #ffffff;
      --primary: #00b06f; 
      --peak-color: #3b82f6; 
      --text-main: #111827;
      --text-sub: #6b7280;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      --border: 1px solid #e5e7eb;
      --header-color: #111827;
      --btn-bg: #f3f4f6;
      --theme-btn-bg: #1f2937;
      --theme-btn-text: #ffffff;
      --tab-bg: #e5e7eb;
      --accent: #f97316;
      --bf-primary: #38bdf8;
      --status-ok: #10b981;
      --status-error: #ef4444;
      --sound-color: #f59e0b;
    }

    body.dark-mode {
      --bg-color: #0c1017;
      --card-bg: #161a22;
      --text-main: #f9fafb;
      --text-sub: #8c96a5;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      --border: 1px solid #222833;
      --header-color: #ffffff;
      --btn-bg: #202632;
      --theme-btn-bg: #00b06f;
      --theme-btn-text: #0c1017;
      --tab-bg: #0c1017;
    }

    body { font-family: 'Prompt', -apple-system, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 16px; transition: background 0.2s, color 0.2s; overflow-x: hidden; }
    .wrapper { max-width: 1200px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    
    .brand-container { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 250px; }
    .brand-logo { height: 42px; width: auto; object-fit: contain; border-radius: 6px; }
    header .header-title { flex: unset; min-width: unset; }

    header h1 { margin: 0; font-size: 20px; font-weight: 600; color: var(--header-color); letter-spacing: -0.3px; }
    header p { margin: 2px 0 0 0; color: var(--text-sub); font-size: 13px; }

    .header-actions { display: flex; flex-wrap: wrap; gap: 8px; width: auto; justify-content: flex-end; }
    .btn-action-toggle { background: var(--theme-btn-bg); color: var(--theme-btn-text); padding: 8px 12px; border: none; border-radius: 20px; font-weight: 500; font-family: inherit; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; flex: 1; min-width: 90px; white-space: nowrap; transition: 0.2s; }
    .btn-action-toggle:active { transform: scale(0.95); }

    /* Tabs */
    .main-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; background: var(--card-bg); padding: 6px; border-radius: 12px; border: var(--border); }
    .main-tab-btn { flex: 1; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; background: transparent; color: var(--text-sub); font-family: 'Inter', 'Prompt', sans-serif; font-weight: 600; font-size: 14px; white-space: nowrap; transition: all 0.2s; }
    .main-tab-btn.active { background: var(--primary); color: #ffffff; box-shadow: 0 4px 10px rgba(0, 176, 111, 0.2); }
    .main-tab-btn.bf-tab.active { background: var(--bf-primary); box-shadow: 0 4px 10px rgba(56, 189, 248, 0.2); }

    /* Cards */
    .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .status-card { background: var(--card-bg); border-radius: 12px; padding: 16px 20px; box-shadow: var(--shadow); border: var(--border); display: flex; justify-content: space-between; align-items: center; transition: transform 0.15s; cursor: pointer; }
    .status-card:active { transform: scale(0.98); } 

    .card-info { flex: 1; min-width: 0; }
    .card-info h3 { margin: 0 0 8px 0; font-size: 14px; color: var(--text-sub); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vib-value-container { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
    .vib-value-row { display: flex; align-items: baseline; gap: 8px; }
    .vib-value-row .v-label { font-size: 11px; font-weight: 700; color: var(--text-sub); width: 38px; background: rgba(107, 114, 128, 0.1); padding: 2px 4px; border-radius: 4px; text-align: center; }
    .vib-value-row .v-label.snd { background: rgba(245, 158, 11, 0.15); color: var(--sound-color); }
    .vib-value-row .value { font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 700; line-height: 1; color: var(--text-main); }
    .vib-value-row .value span { font-family: 'Prompt', sans-serif; font-size: 11px; font-weight: 400; color: var(--text-sub); margin-left: 2px; }
    .card-info .time { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--text-sub); display: flex; align-items: center; gap: 4px; }
    
    .charts-wrapper { display: flex; flex-direction: column; gap: 4px; justify-content: center; align-items: flex-end; min-width: 105px; }
    .sparkline-container { width: 100px; height: 30px; min-width: 100px; min-height: 30px; pointer-events: none; }

    /* Bag Filter Layout */
    .bf-layout { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .mqtt-header { display: flex; justify-content: flex-end; width: 100%; margin-bottom: 8px; }
    .mqtt-status { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; background: var(--card-bg); border: var(--border); padding: 6px 12px; border-radius: 20px; box-shadow: var(--shadow); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--status-error); }
    .status-dot.online { background-color: var(--status-ok); box-shadow: 0 0 8px var(--status-ok); }

    /* Alerts */
    @keyframes flashDanger { 0%, 100% { background-color: var(--card-bg); border-color: var(--border); } 50% { background-color: rgba(239, 68, 68, 0.08); border-color: #ef4444; } }
    .alert-danger { animation: flashDanger 1s infinite !important; }
    .alert-danger .value, .alert-danger h3, .alert-danger .v-label { color: #ef4444 !important; }
    .alert-danger .v-label { background: rgba(239, 68, 68, 0.15); }

    /* Modal & Fullscreen Styles */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.2s ease; }
    .modal-overlay.show { display: flex; opacity: 1; }
    .modal-content { background: var(--bg-color); width: 100%; max-width: 980px; max-height: 92vh; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: var(--border); transform: scale(0.96); transition: all 0.25s cubic-bezier(0.1, 0.9, 0.2, 1); }
    .modal-overlay.show .modal-content { transform: scale(1); }

    .modal-content:fullscreen, .modal-content:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      padding: 20px !important;
    }
    .modal-content:fullscreen .modal-body-scroll,
    .modal-content:-webkit-full-screen .modal-body-scroll {
      height: calc(100vh - 120px) !important;
      display: flex;
      flex-direction: column;
    }
    .modal-content:fullscreen .chart-container,
    .modal-content:-webkit-full-screen .chart-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .modal-content:fullscreen .chart-wrapper,
    .modal-content:-webkit-full-screen .chart-wrapper {
      flex-grow: 1;
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-shrink: 0; }
    .modal-title { margin: 0; font-size: 18px; font-weight: 600; color: var(--header-color); }
    .modal-actions { display: flex; gap: 8px; align-items: center; }
    .close-btn { background: var(--btn-bg); color: var(--text-main); border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
    .close-btn:hover { background: var(--theme-btn-bg); color: var(--theme-btn-text); }

    .sensor-stats-bar { display: flex; gap: 16px; align-items: center; background: var(--card-bg); border: var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; flex-wrap: wrap; }
    .stat-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-sub); }
    .stat-item .val { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; color: var(--text-main); }

    .modal-body-scroll { flex-grow: 1; overflow-y: auto; overflow-x: hidden; padding-right: 6px; }
    .control-panel { background: var(--tab-bg); border-radius: 10px; padding: 4px; margin-bottom: 12px; }
    .btn-group { display: flex; gap: 2px; width: 100%; }
    button.filter-btn { flex: 1; padding: 8px 0; border: none; border-radius: 8px; cursor: pointer; background: transparent; color: var(--text-sub); font-family: 'Inter', 'Prompt', sans-serif; font-weight: 600; font-size: 13px; transition: all 0.2s; }
    button.filter-btn.active { background: var(--card-bg); color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    body[data-modal="bf"] button.filter-btn.active { color: var(--bf-primary); }
    
    button.filter-btn#btn-live.active { background: #10b981 !important; color: #ffffff !important; box-shadow: 0 2px 10px rgba(16, 185, 129, 0.3); }

    .chart-container { background: var(--card-bg); border-radius: 12px; padding: 14px; border: var(--border); width: 100%; }
    .chart-wrapper { position: relative; width: 100%; display: flex; flex-direction: column; gap: 18px; }
    .chart-instance { width: 100%; min-height: 280px; }

    @media (max-width: 768px) {
      body { padding: 12px; }
      .header-actions { width: 100%; justify-content: space-between; }
      .status-grid { grid-template-columns: 1fr; gap: 10px; }
      .modal-overlay { padding: 12px; } 
      .modal-content { max-height: 92vh; padding: 16px; }
      .main-tabs { gap: 4px; padding: 4px; }
      .main-tab-btn { padding: 8px 4px; font-size: 12px; letter-spacing: -0.3px; }
      .main-tabs::-webkit-scrollbar { display: none; }
    }

    .apexcharts-text { font-family: 'Inter', sans-serif !important; font-weight: 500; }
    .apexcharts-tooltip { background: var(--card-bg) !important; border: 1px solid var(--border) !important; box-shadow: var(--shadow) !important; border-radius: 8px !important; color: var(--text-main) !important; }
    .apexcharts-tooltip-title { font-family: 'Prompt', sans-serif !important; font-size: 12px !important; background: rgba(0,0,0,0.03) !important; border-bottom: 1px solid var(--border) !important; font-weight: 600 !important; }
    body.dark-mode .apexcharts-tooltip-title { background: rgba(255,255,255,0.05) !important; }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <div class="brand-container">
        <img src="scg-logo-n.jpg" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <div class="header-title">
          <h1><i class="fa-solid fa-wave-square" style="color: var(--primary); margin-right: 4px;" id="header-icon"></i> <span id="header-text">มอนิเตอร์ความสั่นสะเทือน & เสียง</span></h1>
          <p id="header-sub">ข้อมูลเซ็นเซอร์แบบเรียลไทม์</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-action-toggle" onclick="setAlarmLimit()" style="background: var(--accent); color: white;" id="alarm-btn">
          <i class="fa-solid fa-triangle-exclamation"></i> Alarm: <span id="alarm-display">40</span>
        </button>
        <button class="btn-action-toggle" id="auto-toggle" onclick="toggleAutoMode()" style="background: var(--primary); color: white;">
          <i class="fa-solid fa-rotate"></i> <span>Auto (10s)</span>
        </button>
        <button class="btn-action-toggle" id="sound-toggle" onclick="toggleSound()">
          <i class="fa-solid fa-bell-slash"></i> ปิดเสียง
        </button>
        <button class="btn-action-toggle" id="theme-toggle" onclick="toggleDarkMode()">
          <i class="fa-solid fa-moon"></i> กลางคืน
        </button>
      </div>
    </header>

    <div class="main-tabs">
      <button class="main-tab-btn active" data-group="cm10-11" onclick="switchTab('cm10-11')">CM10-11</button>
      <button class="main-tab-btn" data-group="cm7-9" onclick="switchTab('cm7-9')">CM7-9</button>
      <button class="main-tab-btn" data-group="cm5-6" onclick="switchTab('cm5-6')">CM5-6</button>
      <button class="main-tab-btn bf-tab" data-group="gate-bf" onclick="switchTab('gate-bf')">PS. BF</button>
    </div>

    <!-- Container สำหรับ Vibration & Sound -->
    <div class="status-grid" id="devices-container"></div>

    <!-- Container สำหรับ Bag Filter -->
    <div class="bf-layout" id="bf-container" style="display: none;">
      <div class="mqtt-header">
        <div class="mqtt-status">
          <div class="status-dot" id="mqtt-dot"></div><span id="mqtt-text">Wait</span>
        </div>
      </div>
      <div class="status-grid" id="gates-container"></div>
    </div>
  </div>

  <!-- Modal แสดงกราฟ -->
  <div class="modal-overlay" id="chartModal" onclick="closeModalOutside(event)">
    <div class="modal-content" id="modalWindow">
      
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Loading...</h2>
        <div class="modal-actions">
          <button class="close-btn" onclick="toggleFullscreen()" title="ขยายเต็มจอ / ย่อหน้าจอ">
            <i class="fa-solid fa-expand" id="fs-icon"></i>
          </button>
          <button class="close-btn" onclick="closeModal()" title="ปิด">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <div class="sensor-stats-bar" id="modal-temp-bar">
        <div class="stat-item">
          <i class="fa-solid fa-temperature-half" style="color: #ef4444;"></i> 
          <span>อุณหภูมิมอเตอร์:</span>
          <span class="val" id="modal-temp">-- °C</span>
        </div>
        <div class="stat-item" id="modal-sound-box">
          <i class="fa-solid fa-volume-high" style="color: var(--sound-color);"></i> 
          <span>ระดับเสียง:</span>
          <span class="val" id="modal-sound">-- dB</span>
        </div>
      </div>

      <div class="modal-body-scroll">
        <div class="control-panel" id="modal-time-controls">
          <div class="btn-group">
            <button class="filter-btn active" id="btn-live" onclick="switchToLiveMode()" style="display: none;">
              <i class="fa-solid fa-bolt"></i> Live
            </button>
            <button class="filter-btn" id="btn-1" onclick="loadDataByDuration(1)">1h</button>
            <button class="filter-btn" id="btn-6" onclick="loadDataByDuration(6)">6h</button>
            <button class="filter-btn" id="btn-12" onclick="loadDataByDuration(12)">12h</button>
            <button class="filter-btn" id="btn-24" onclick="loadDataByDuration(24)">1d</button>
            <button class="filter-btn" id="btn-120" onclick="loadDataByDuration(120)">5d</button>
            <button class="filter-btn" id="btn-168" onclick="loadDataByDuration(168)">7d</button>
          </div>
        </div>

        <div class="chart-container">
          <div class="chart-wrapper">
            <!-- 1. กราฟ Vibration Motor (สลับขึ้นด้านบน) -->
            <div id="vibChartTop" class="chart-instance" style="display: none;"></div>
            <!-- 2. กราฟ Vibration Down -->
            <div id="vibChart" class="chart-instance"></div>
            <!-- 3. กราฟ Sound History (dB) -->
            <div id="soundChart" class="chart-instance" style="display: none;"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    /* ==========================================
       1. ส่วนตั้งค่า Vibration & Sound (Firebase)
       ========================================== */
    const DEVICE_LIST = [
      { id: "NOED6522-18", label: "CM10 (6522-18)", color: "#3b82f6", group: "cm10-11" },
      { id: "NOED6522-18TOP", label: "CM10 (6522-18)", color: "#2563eb", group: "cm10-11" },
      { id: "NOED6522-20", label: "CM10 (6522-20)", color: "#8b5cf6", group: "cm10-11" },
      { id: "NOED6522-20TOP", label: "CM10 (6522-20)", color: "#7c3aed", group: "cm10-11" },
      { id: "NOED6523-26", label: "CM10 (6523-26)", color: "#0ea5e9", group: "cm10-11" },
      { id: "NOED6532-18", label: "CM11 (6532-18)", color: "#eab308", group: "cm10-11" },
      { id: "NOED6532-18TOP", label: "CM11 (6532-18)", color: "#ca8a04", group: "cm10-11" },
      { id: "NOED6532-20", label: "CM11 (6532-20)", color: "#ec4899", group: "cm10-11" },
      { id: "NOED6532-20TOP", label: "CM11 (6532-20)", color: "#db2777", group: "cm10-11" },
      { id: "NOED6533-26", label: "CM11 (6533-26)", color: "#f43f5e", group: "cm10-11" },
      { id: "NOED6511-23", label: "CLINKER (6511-23)", color: "#ff5722", group: "cm10-11" },
      { id: "NOED6511-25", label: "CLINKER (6511-25)", color: "#00b06f", group: "cm10-11" },
      { id: "NOED6413-03", label: "GYP (6413-03)", color: "#14b8a6", group: "cm10-11" },
      { id: "NOED542-22",  label: "CM9 (542-22)", color: "#3b82f6", group: "cm7-9" },
      { id: "NOED522-23",  label: "CM7 (522-23)", color: "#8b5cf6", group: "cm7-9" },
      { id: "NOED511-23",  label: "CLINKER (511-23)", color: "#ff5722", group: "cm7-9" },
      { id: "NOED511-25",  label: "CLINKER (511-25)", color: "#00b06f", group: "cm7-9" },
      { id: "NOED413-03",  label: "GYP (413-03)", color: "#14b8a6", group: "cm7-9" },
      { id: "NOEDZ5J07",   label: "CM5 (Z5J07)", color: "#3b82f6", group: "cm5-6" },
      { id: "NOEDZ6J07",   label: "CM6 (Z6J07)", color: "#8b5cf6", group: "cm5-6" },
      { id: "NOEDU5J7",    label: "CLINKER (U5J7)", color: "#ff5722", group: "cm5-6" },
      { id: "NOEDU6J17",   label: "CLINKER (U6J17)", color: "#00b06f", group: "cm5-6" }
    ];

    const firebaseConfig = {
      apiKey: "AIzaSyCCSwEUELEQkE0kqXeDJ4526zC_yAaNPPU", 
      databaseURL: "https://smart-vibrationcm-default-rtdb.asia-southeast1.firebasedatabase.app" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    /* ==========================================
       2. ส่วนตั้งค่า Bag Filter (MQTT & UI)
       ========================================== */
    const gatesConfig = [
        { id: 'p1', name: '6526.04', color: '#38bdf8' },
        { id: 'p2', name: '6524.041', color: '#38bdf8' },
        { id: 'p3', name: '6526.08', color: '#38bdf8' },
        { id: 'p4', name: '6536.04', color: '#38bdf8' },
        { id: 'p5', name: '6536.041', color: '#38bdf8' },
        { id: 'p6', name: '6536.08', color: '#38bdf8' },
        { id: 'p7', name: '6511.76', color: '#38bdf8' },
        { id: 'p8', name: '6511.80', color: '#38bdf8' }
    ];
    let bfHistory = []; 

    let isLiveMode = false;
    let bfLiveBuffers = {}; 
    const MAX_LIVE_POINTS = 50;
    const MAX_SPARK_POINTS = 20;
    let vibSparkBuffers = {}; 
    let soundSparkBuffers = {}; 

    /* ==========================================
       3. ตัวแปร Global & Chart Configuration
       ========================================== */
    let alarmLimit = parseFloat(localStorage.getItem('vibAlarmLimit')) || 40.0;
    let latestValues = {}; 
    let alertStatus = {}; 
    let currentTabGroup = 'cm10-11'; 

    let isAutoMode = true; 
    let autoTimer = null;
    const tabCycle = ['cm10-11', 'cm7-9', 'cm5-6', 'gate-bf']; 
    let autoRemaining = 10; 
    const AUTO_MAX_TIME = 10;

    let myChart = null; 
    let myChartTop = null; 
    let myChartSound = null; 
    let sparkCharts = {}; 
    let currentDurationHours = 6; 
    let activeNodeBase = null; 
    let activeNodeTop = null; 
    let isModalOpen = false;
    let currentModalType = 'vib';

    let activeGateKey = null;
    let activeGateTitle = '';
    let activeGateColor = '';

    const alarmSound = new Audio('https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg');
    alarmSound.loop = true; 
    let isSoundEnabled = false;

    const sparkOptions = {
        chart: { 
          type: 'line', 
          width: 100, 
          height: 30, 
          sparkline: { enabled: true }, 
          animations: { enabled: false } 
        },
        stroke: { curve: 'smooth', width: 2 },
        tooltip: { fixed: { enabled: false }, x: { show: false }, y: { title: { formatter: () => '' } }, marker: { show: false } }
    };

    /* ==========================================
       4. Auto & Tab Switcher
       ========================================== */
    function toggleAutoMode() {
      isAutoMode = !isAutoMode;
      if (isAutoMode) {
        autoRemaining = AUTO_MAX_TIME;
        startAutoTimer();
      } else { stopAutoTimer(); }
      updateAutoModeUI();
    }

    function updateAutoModeUI() {
      const btn = document.getElementById('auto-toggle');
      if (isAutoMode) {
        btn.innerHTML = `<i class="fa-solid fa-rotate"></i> <span>Auto (${autoRemaining}s)</span>`;
        btn.style.background = 'var(--primary)';
        btn.style.color = '#ffffff';
      } else {
        btn.innerHTML = '<i class="fa-solid fa-hand-pointer"></i> <span>Manual</span>';
        btn.style.background = 'var(--theme-btn-bg)';
        btn.style.color = 'var(--theme-btn-text)';
      }
    }

    function startAutoTimer() {
      stopAutoTimer();
      autoTimer = setInterval(() => {
        if (isModalOpen) return; 
        autoRemaining--; 
        updateAutoModeUI();
        if (autoRemaining <= 0) {
          autoRemaining = AUTO_MAX_TIME;
          let currentIndex = tabCycle.indexOf(currentTabGroup);
          let nextIndex = (currentIndex + 1) % tabCycle.length;
          switchTabCore(tabCycle[nextIndex]); 
        }
      }, 1000); 
    }
    function stopAutoTimer() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }

    function switchTab(group) {
      switchTabCore(group);
      if (isAutoMode) { autoRemaining = AUTO_MAX_TIME; updateAutoModeUI(); startAutoTimer(); }
    }

    function switchTabCore(group) {
      currentTabGroup = group;
      
      document.querySelectorAll('.main-tab-btn').forEach(btn => {
        if(btn.dataset.group === group) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      const devContainer = document.getElementById('devices-container');
      const bfContainer = document.getElementById('bf-container');
      const headerIcon = document.getElementById('header-icon');
      const headerText = document.getElementById('header-text');
      const alarmBtn = document.getElementById('alarm-btn');

      if (group === 'gate-bf') {
        devContainer.style.display = 'none';
        bfContainer.style.display = 'flex';
        headerIcon.className = "fa-solid fa-wind";
        headerIcon.style.color = "var(--bf-primary)";
        headerText.innerText = "CM 10-11 Bag Filter";
        alarmBtn.style.display = 'none'; 
      } else {
        devContainer.style.display = 'grid';
        bfContainer.style.display = 'none';
        headerIcon.className = "fa-solid fa-wave-square";
        headerIcon.style.color = "var(--primary)";
        headerText.innerText = "มอนิเตอร์ความสั่นสะเทือน & เสียง";
        alarmBtn.style.display = 'flex';

        const bases = DEVICE_LIST.filter(d => !d.id.endsWith('TOP'));
        bases.forEach(dev => {
          const card = document.getElementById(`card-${dev.id}`);
          if(card) card.style.display = (dev.group === group) ? 'flex' : 'none';
        });
      }

      setTimeout(() => window.dispatchEvent(new Event('resize')), 50);
    }

    /* ==========================================
       5. Fullscreen Toggle
       ========================================== */
    function toggleFullscreen() {
      const modalEl = document.getElementById('modalWindow');
      const iconEl = document.getElementById('fs-icon');

      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (modalEl.requestFullscreen) {
          modalEl.requestFullscreen();
        } else if (modalEl.webkitRequestFullscreen) {
          modalEl.webkitRequestFullscreen();
        }
        iconEl.className = "fa-solid fa-compress";
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        iconEl.className = "fa-solid fa-expand";
      }
      setTimeout(() => window.dispatchEvent(new Event('resize')), 200);
    }

    /* ==========================================
       7. Live Data (Firebase & MQTT)
       ========================================== */
    function listenLiveStatus() {
      DEVICE_LIST.forEach(dev => {
        const baseId = dev.id.endsWith('TOP') ? dev.id.replace('TOP', '') : dev.id;

        // 1. ดึงข้อมูล 20 จุดล่าสุดมาพล็อต sparkline
        db.ref(`Vibration_Logs/${dev.id}`).limitToLast(MAX_SPARK_POINTS).once('value', snap => {
          const initPoints = [];
          const soundPoints = [];
          snap.forEach(c => {
            const val = c.val();
            if (val && val.ax !== undefined && val.ax !== null) {
              initPoints.push(parseFloat(val.ax));
            }
            const sVal = (val.soundMax !== undefined && val.soundMax !== null) ? parseFloat(val.soundMax) :
                         (val.sound !== undefined && val.sound !== null) ? parseFloat(val.sound) :
                         (val.snd !== undefined && val.snd !== null) ? parseFloat(val.snd) :
                         (val.noise !== undefined && val.noise !== null) ? parseFloat(val.noise) : null;
            if (sVal !== null) soundPoints.push(sVal);
          });

          if (initPoints.length > 0) {
            vibSparkBuffers[dev.id] = initPoints;
            if (sparkCharts[dev.id]) sparkCharts[dev.id].updateSeries([{ data: initPoints }]);
          }

          if (soundPoints.length > 0 && !dev.id.endsWith('TOP')) {
            soundSparkBuffers[baseId] = soundPoints;
            const lastSound = soundPoints[soundPoints.length - 1];
            const soundEl = document.getElementById(`val-sound-${baseId}`);
            if (soundEl) soundEl.innerHTML = lastSound.toFixed(1) + " <span>dB</span>";
            if (sparkCharts['sound-' + baseId]) {
              sparkCharts['sound-' + baseId].updateSeries([{ data: soundPoints }]);
            }
          }
        });

        // 2. รับค่า Real-time
        db.ref(`Vibration_Logs/${dev.id}`).limitToLast(1).on('value', snap => {
          snap.forEach(child => {
            let data = child.val();
            let currentVal = data.ax;
            let soundVal = (data.soundMax !== undefined && data.soundMax !== null) ? parseFloat(data.soundMax) :
                           (data.sound !== undefined && data.sound !== null) ? parseFloat(data.sound) :
                           (data.snd !== undefined && data.snd !== null) ? parseFloat(data.snd) :
                           (data.noise !== undefined && data.noise !== null) ? parseFloat(data.noise) : null;

            if (currentVal !== undefined && currentVal !== null) {
                latestValues[dev.id] = currentVal;
                
                const valEl = document.getElementById(`val-${dev.id}`);
                if (valEl) valEl.innerHTML = currentVal.toFixed(2) + " <span>mm/s</span>";
                
                if (!dev.id.endsWith('TOP')) {
                    document.getElementById(`time-${baseId}`).innerHTML = `<i class="fa-regular fa-clock"></i> ` + dayjs(data.gatewayEpoch * 1000).format('HH:mm:ss');
                }
                
                alertStatus[dev.id] = (currentVal >= alarmLimit);
                let topId = baseId + 'TOP';
                let hasAlarm = alertStatus[baseId] === true || alertStatus[topId] === true;
                const card = document.getElementById(`card-${baseId}`);
                if (card) {
                    if (hasAlarm) card.classList.add('alert-danger');
                    else card.classList.remove('alert-danger');
                }
                triggerAlarmLogic();

                // อัปเดต Sparkline Vib
                if (!vibSparkBuffers[dev.id]) vibSparkBuffers[dev.id] = [];
                vibSparkBuffers[dev.id].push(currentVal);
                if (vibSparkBuffers[dev.id].length > MAX_SPARK_POINTS) vibSparkBuffers[dev.id].shift();
                if (sparkCharts[dev.id]) sparkCharts[dev.id].updateSeries([{ data: vibSparkBuffers[dev.id] }]);
            }

            // จัดการข้อมูลระดับเสียง (Sound dB)
            if (soundVal !== null && !dev.id.endsWith('TOP')) {
                const soundEl = document.getElementById(`val-sound-${baseId}`);
                if (soundEl) soundEl.innerHTML = soundVal.toFixed(1) + " <span>dB</span>";

                if (!soundSparkBuffers[baseId]) soundSparkBuffers[baseId] = [];
                soundSparkBuffers[baseId].push(soundVal);
                if (soundSparkBuffers[baseId].length > MAX_SPARK_POINTS) soundSparkBuffers[baseId].shift();
                
                if (sparkCharts['sound-' + baseId]) {
                  sparkCharts['sound-' + baseId].updateSeries([{ data: soundSparkBuffers[baseId] }]);
                }

                // ถ้ากำลังเปิด Modal ของเครื่องนี้อยู่ ให้ปรับค่าด้านบนด้วย
                if (isModalOpen && activeNodeBase === baseId) {
                  document.getElementById('modal-sound').innerText = `${soundVal.toFixed(1)} dB`;
                }
            }
          });
        });
      });
    }

    const broker = "4d79d42984154e37aab32ca068370f40.s1.eu.hivemq.cloud";
    const port = 8884; 
    const topic = "factory/bagfilter/pressures";
    const clientId = "WebClient-UI-" + Math.random().toString(16).substr(2, 8);
    const mqtt_user = "esp32_bagfilter_sensor";
    const mqtt_password = "Mcl195088";
    const client = new Paho.MQTT.Client(broker, port, clientId);

    client.onConnectionLost = function() {
        document.getElementById("mqtt-dot").classList.remove("online");
        document.getElementById("mqtt-text").innerText = "Offline";
        setTimeout(connectMQTT, 5000);
    };

    client.onMessageArrived = function(message) {
        try {
            const data = JSON.parse(message.payloadString);
            const timeNow = dayjs().format('HH:mm:ss');
            
            gatesConfig.forEach((gate, idx) => {
                const rawVal = data[`p${idx+1}`];
                const val = (rawVal !== undefined && rawVal !== null) ? parseFloat(rawVal) : 0.0;
                
                const valEl = document.getElementById(`val-${gate.id}`);
                if (valEl) valEl.innerHTML = val.toFixed(2) + " <span>Bar</span>";

                const card = document.getElementById(`card-${gate.id}`);
                const statusText = document.getElementById(`status-${gate.id}`);
                
                if (val < 4) {
                    if(card) card.classList.add('alert-danger');
                    if(statusText) {
                      statusText.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Low Pressure';
                      statusText.style.color = '#ef4444';
                    }
                } else {
                    if(card) card.classList.remove('alert-danger');
                    if(statusText) {
                      statusText.innerHTML = '<i class="fa-solid fa-circle-check"></i> Normal';
                      statusText.style.color = 'var(--text-sub)';
                    }
                }

                if (!bfLiveBuffers[gate.id]) {
                    bfLiveBuffers[gate.id] = { labels: [], data: [] };
                }
                bfLiveBuffers[gate.id].labels.push(timeNow);
                bfLiveBuffers[gate.id].data.push(val);

                if (bfLiveBuffers[gate.id].labels.length > MAX_LIVE_POINTS) {
                    bfLiveBuffers[gate.id].labels.shift();
                    bfLiveBuffers[gate.id].data.shift();
                }

                if (sparkCharts[gate.id]) {
                  sparkCharts[gate.id].updateSeries([{ data: bfLiveBuffers[gate.id].data.slice(-MAX_SPARK_POINTS) }]);
                }
            });

            if (isModalOpen && currentModalType === 'bf' && isLiveMode && activeGateKey) {
                const curBuf = bfLiveBuffers[activeGateKey];
                if (curBuf && myChart) {
                    myChart.updateOptions({
                        xaxis: { categories: curBuf.labels },
                        series: [{ name: 'Pressure', data: curBuf.data }]
                    }, false, false);
                }
            }
        } catch(e) {
            console.error("MQTT parse error", e);
        }
    };

    function connectMQTT() {
        client.connect({
            userName: mqtt_user, password: mqtt_password, useSSL: true,
            onSuccess: function() {
                document.getElementById("mqtt-dot").classList.add("online");
                document.getElementById("mqtt-text").innerText = "Live";
                client.subscribe(topic);
            },
            onFailure: function() { setTimeout(connectMQTT, 5000); }
        });
    }

    function switchToLiveMode() {
      isLiveMode = true;
      setActiveFilterButton('btn-live');
      if (activeGateKey && bfLiveBuffers[activeGateKey]) {
        const curBuf = bfLiveBuffers[activeGateKey];
        myChart.updateOptions({
            xaxis: { categories: curBuf.labels },
            series: [{ name: 'Pressure', data: curBuf.data }]
        });
      }

    function loadDataByDuration(hours) {
      isLiveMode = false;
      currentDurationHours = hours;
      setActiveFilterButton(`btn-${hours}`);

      if (currentModalType === 'vib') {
        // ดึงข้อมูลสำหรับ Base node (พร้อม Sound)
        fetchVibData(activeNodeBase, hours, myChart, true);
        
        // ถ้ามี Motor node ให้ดึงแยก
        if (activeNodeTop && DEVICE_LIST.find(d => d.id === activeNodeTop)) {
          fetchVibData(activeNodeTop, hours, myChartTop, false);
        }
      } else if (currentModalType === 'bf') {
        const labels = bfHistory.map(r => dayjs(r.Timestamp).format('DD/MM HH:mm')).slice(-hours * 10);
        const data = bfHistory.map(r => parseFloat(r[activeGateKey]) || 0).slice(-hours * 10);
        myChart.updateOptions({
            xaxis: { categories: labels },
            series: [{ name: 'Pressure', data: data }]
        });
      }
    }

    function fetchVibData(nodeId, hours, chartInstance, isBaseNode = false) {
      const startTime = Date.now() - (hours * 60 * 60 * 1000);
      db.ref(`Vibration_Logs/${nodeId}`)
        .orderByChild('gatewayEpoch')
        .startAt(startTime / 1000)
        .once('value', snap => {
          const labels = [];
          const values = [];
          const soundValues = [];
          let lastTemp = null;
          let lastSound = null;

          snap.forEach(child => {
            const val = child.val();
            labels.push(dayjs(val.gatewayEpoch * 1000).format('HH:mm:ss'));
            values.push(val.ax !== undefined ? val.ax : 0);
            if (val.temp !== undefined) lastTemp = val.temp;

            // ตรวจสอบชื่อฟิลด์ Sound ครบทุกรูปแบบ
            const sVal = (val.soundMax !== undefined && val.soundMax !== null) ? parseFloat(val.soundMax) :
                         (val.sound !== undefined && val.sound !== null) ? parseFloat(val.sound) :
                         (val.snd !== undefined && val.snd !== null) ? parseFloat(val.snd) :
                         (val.noise !== undefined && val.noise !== null) ? parseFloat(val.noise) : null;
            if (sVal !== null) {
              soundValues.push(sVal);
              lastSound = sVal;
            } else {
              soundValues.push(null);
            }
          });

          // อัปเดตกราฟการสั่นสะเทือน
          if (chartInstance) {
            chartInstance.updateOptions({
              xaxis: { categories: labels },
              series: [{ name: 'Vibration', data: values }]
            });
          }

          // ถ้าเป็น Base Node ให้จัดการข้อมูลเสียง & อุณหภูมิ
          if (isBaseNode) {
            if (lastTemp !== null) document.getElementById('modal-temp').innerText = `${lastTemp.toFixed(1)} °C`;
            if (lastSound !== null) document.getElementById('modal-sound').innerText = `${lastSound.toFixed(1)} dB`;

            // อัปเดตข้อมูลเข้ากราฟประวัติเสียง (Sound Chart)
            if (myChartSound) {
              myChartSound.updateOptions({
                xaxis: { categories: labels },
                series: [{ name: 'Sound Max', data: soundValues }]
              });
            }
          }
        });
    }

    function setActiveFilterButton(btnId) {
      document.querySelectorAll('#modal-time-controls .filter-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(btnId);
      if(activeBtn) activeBtn.classList.add('active');
    }

    function closeModal() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen();
      }
      document.getElementById('chartModal').classList.remove('show');
      isModalOpen = false;
    }

    function closeModalOutside(e) {
      if (e.target.classList.contains('modal-overlay')) closeModal();
    }

    /* ==========================================
       9. System Utilities (Alarm, Sound, Theme)
       ========================================== */
    function setAlarmLimit() {
      const val = prompt("ตั้งค่าขีดจำกัดแจ้งเตือน (Alarm Limit mm/s):", alarmLimit);
      if (val !== null && !isNaN(parseFloat(val))) {
        alarmLimit = parseFloat(val);
        localStorage.setItem('vibAlarmLimit', alarmLimit);
        document.getElementById('alarm-display').innerText = alarmLimit;
      }
    }

    function toggleSound() {
      isSoundEnabled = !isSoundEnabled;
      const btn = document.getElementById('sound-toggle');
      if (isSoundEnabled) {
        btn.innerHTML = '<i class="fa-solid fa-bell"></i> เปิดเสียง';
        btn.style.background = '#ef4444';
        btn.style.color = '#ffffff';
      } else {
        btn.innerHTML = '<i class="fa-solid fa-bell-slash"></i> ปิดเสียง';
        btn.style.background = 'var(--theme-btn-bg)';
        btn.style.color = 'var(--theme-btn-text)';
        alarmSound.pause();
      }
    }

    function triggerAlarmLogic() {
      const hasAnyAlarm = Object.values(alertStatus).some(status => status === true);
      if (hasAnyAlarm && isSoundEnabled) {
        alarmSound.play().catch(() => {});
      } else {
        alarmSound.pause();
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      document.getElementById('theme-toggle').innerHTML = isDark 
        ? '<i class="fa-solid fa-sun"></i> กลางวัน' 
        : '<i class="fa-solid fa-moon"></i> กลางคืน';
    }

    window.onload = function() {
      initializeDashboard();
      listenLiveStatus();
      connectMQTT();
      fetchBFHistory();
      setInterval(fetchBFHistory, 60000);
    };
  </script>
</body>
