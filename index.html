<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบมอนิเตอร์อัจฉริยะ (Vib, Sound & Bag Filter)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase (Vibration & Sound) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <!-- MQTT (Bag Filter) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <!-- Charts & Time -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>

  <style>
    /* RESET & THEME CONFIGURATION */
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg-color: #f6f8fa;
      --card-bg: #ffffff;
      --primary: #00b06f; 
      --peak-color: #3b82f6; 
      --text-main: #111827;
      --text-sub: #6b7280;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      --border: 1px solid #e5e7eb;
      --header-color: #111827;
      --btn-bg: #f3f4f6;
      --theme-btn-bg: #1f2937;
      --theme-btn-text: #ffffff;
      --tab-bg: #e5e7eb;
      --accent: #f97316;
      --bf-primary: #38bdf8;
      --status-ok: #10b981;
      --status-error: #ef4444;
      --sound-color: #f59e0b;
    }

    body.dark-mode {
      --bg-color: #0c1017;
      --card-bg: #161a22;
      --text-main: #f9fafb;
      --text-sub: #8c96a5;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      --border: 1px solid #222833;
      --header-color: #ffffff;
      --btn-bg: #202632;
      --theme-btn-bg: #00b06f;
      --theme-btn-text: #0c1017;
      --tab-bg: #0c1017;
    }

    body { font-family: 'Prompt', -apple-system, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 16px; transition: background 0.2s, color 0.2s; overflow-x: hidden; }
    .wrapper { max-width: 1200px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    
    .brand-container { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 250px; }
    .brand-logo { height: 42px; width: auto; object-fit: contain; border-radius: 6px; }
    header .header-title { flex: unset; min-width: unset; }

    header h1 { margin: 0; font-size: 20px; font-weight: 600; color: var(--header-color); letter-spacing: -0.3px; }
    header p { margin: 2px 0 0 0; color: var(--text-sub); font-size: 13px; }

    .header-actions { display: flex; flex-wrap: wrap; gap: 8px; width: auto; justify-content: flex-end; }
    .btn-action-toggle { background: var(--theme-btn-bg); color: var(--theme-btn-text); padding: 8px 12px; border: none; border-radius: 20px; font-weight: 500; font-family: inherit; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; flex: 1; min-width: 90px; white-space: nowrap; transition: 0.2s; }
    .btn-action-toggle:active { transform: scale(0.95); }

    /* Tabs */
    .main-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; background: var(--card-bg); padding: 6px; border-radius: 12px; border: var(--border); }
    .main-tab-btn { flex: 1; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; background: transparent; color: var(--text-sub); font-family: 'Inter', 'Prompt', sans-serif; font-weight: 600; font-size: 14px; white-space: nowrap; transition: all 0.2s; }
    .main-tab-btn.active { background: var(--primary); color: #ffffff; box-shadow: 0 4px 10px rgba(0, 176, 111, 0.2); }
    .main-tab-btn.bf-tab.active { background: var(--bf-primary); box-shadow: 0 4px 10px rgba(56, 189, 248, 0.2); }

    /* Cards */
    .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .status-card { background: var(--card-bg); border-radius: 12px; padding: 16px 20px; box-shadow: var(--shadow); border: var(--border); display: flex; justify-content: space-between; align-items: center; transition: transform 0.15s; cursor: pointer; }
    .status-card:active { transform: scale(0.98); } 

    .card-info { flex: 1; min-width: 0; }
    .card-info h3 { margin: 0 0 8px 0; font-size: 14px; color: var(--text-sub); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vib-value-container { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
    .vib-value-row { display: flex; align-items: baseline; gap: 8px; }
    .vib-value-row .v-label { font-size: 11px; font-weight: 700; color: var(--text-sub); width: 38px; background: rgba(107, 114, 128, 0.1); padding: 2px 4px; border-radius: 4px; text-align: center; }
    .vib-value-row .v-label.snd { background: rgba(245, 158, 11, 0.15); color: var(--sound-color); }
    .vib-value-row .value { font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 700; line-height: 1; color: var(--text-main); }
    .vib-value-row .value span { font-family: 'Prompt', sans-serif; font-size: 11px; font-weight: 400; color: var(--text-sub); margin-left: 2px; }
    .card-info .time { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--text-sub); display: flex; align-items: center; gap: 4px; }
    
    .charts-wrapper { display: flex; flex-direction: column; gap: 4px; justify-content: center; align-items: flex-end; min-width: 105px; }
    .sparkline-container { width: 100px; height: 30px; min-width: 100px; min-height: 30px; pointer-events: none; }

    /* Bag Filter Layout */
    .bf-layout { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .mqtt-header { display: flex; justify-content: flex-end; width: 100%; margin-bottom: 8px; }
    .mqtt-status { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; background: var(--card-bg); border: var(--border); padding: 6px 12px; border-radius: 20px; box-shadow: var(--shadow); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--status-error); }
    .status-dot.online { background-color: var(--status-ok); box-shadow: 0 0 8px var(--status-ok); }

    /* Alerts */
    @keyframes flashDanger { 0%, 100% { background-color: var(--card-bg); border-color: var(--border); } 50% { background-color: rgba(239, 68, 68, 0.08); border-color: #ef4444; } }
    .alert-danger { animation: flashDanger 1s infinite !important; }
    .alert-danger .value, .alert-danger h3, .alert-danger .v-label { color: #ef4444 !important; }
    .alert-danger .v-label { background: rgba(239, 68, 68, 0.15); }

    /* Modal & Fullscreen Styles */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.2s ease; }
    .modal-overlay.show { display: flex; opacity: 1; }
    .modal-content { background: var(--bg-color); width: 100%; max-width: 980px; max-height: 92vh; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: var(--border); transform: scale(0.96); transition: all 0.25s cubic-bezier(0.1, 0.9, 0.2, 1); }
    .modal-overlay.show .modal-content { transform: scale(1); }

    .modal-content:fullscreen, .modal-content:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      padding: 20px !important;
    }
    .modal-content:fullscreen .modal-body-scroll,
    .modal-content:-webkit-full-screen .modal-body-scroll {
      height: calc(100vh - 120px) !important;
      display: flex;
      flex-direction: column;
    }
    .modal-content:fullscreen .chart-container,
    .modal-content:-webkit-full-screen .chart-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .modal-content:fullscreen .chart-wrapper,
    .modal-content:-webkit-full-screen .chart-wrapper {
      flex-grow: 1;
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-shrink: 0; }
    .modal-title { margin: 0; font-size: 18px; font-weight: 600; color: var(--header-color); }
    .modal-actions { display: flex; gap: 8px; align-items: center; }
    .close-btn { background: var(--btn-bg); color: var(--text-main); border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
    .close-btn:hover { background: var(--theme-btn-bg); color: var(--theme-btn-text); }

    .sensor-stats-bar { display: flex; gap: 16px; align-items: center; background: var(--card-bg); border: var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; flex-wrap: wrap; }
    .stat
